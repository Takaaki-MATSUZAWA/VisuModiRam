[package]
name = "sensorlog-ram"
version = "0.1.0"
edition = "2021"
description = "RAM-based high-performance logging system compatible with sensorlog"
authors = ["Takaaki-MATSUZAWA"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
tokio = { version = "1.0", features = ["fs", "rt", "macros"], optional = true }

[features]
default = []
async = ["tokio"]